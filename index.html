<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Life UP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life UP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c2846">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
@font-face{font-family:'Pixel Operator';src:url(fonts/PixelOperator.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Pixel Operator';src:url(fonts/PixelOperator-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
:root{
  --bg:#2c2846; --bg2:#3a3560; --card:#f4f0e6; --ink:#231a2e; --muted:#6b6280;
  --gold:#f0c83c; --gold2:#c9a020; --ok:#4cb85c; --bad:#e04848; --line:#231a2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select,textarea,label{touch-action:manipulation}
.ic{vertical-align:-0.2em;display:inline-block}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pixel Operator',-apple-system,system-ui,sans-serif;font-size:18px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.px{font-weight:700;letter-spacing:.5px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border:3px solid var(--line);
  background:#fff;color:var(--ink);border-radius:10px;-webkit-appearance:none;appearance:none}
textarea{min-height:70px}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:.9rem}

/* topo */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff}
.avatar{width:52px;height:52px;border-radius:12px;overflow:visible;border:3px solid var(--gold);background:#dfe9f5;padding:0;position:relative;flex:none}
.avatar svg{width:100%;height:100%;display:block;border-radius:9px}
.avatar .lv{position:absolute;bottom:-8px;right:-8px;background:var(--gold);color:var(--ink);
  border:2px solid var(--line);font-size:.7rem;padding:1px 5px;border-radius:8px}
.stats{flex:1;min-width:0}
.stats .linha{display:flex;justify-content:space-between;font-size:.85rem}
.bar{height:12px;border:2px solid var(--line);background:#1b1730;margin-top:4px;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.iconbtn{background:none;border:none;padding:4px;line-height:0}

/* conteúdo */
main{padding:4px 12px 16px}
h2{color:#fff;margin:14px 2px 8px;font-size:1.1rem}
.card{background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 #15121f;
  margin:0 0 12px;padding:12px;border-radius:14px}
.sub{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px}
.chip{background:var(--bg2);color:#fff;border:2px solid var(--line);padding:6px 8px;white-space:nowrap;font-size:.8rem;border-radius:10px;flex:1 0 auto}
.chip.on{background:var(--gold);color:var(--ink)}
.chip.off{opacity:.45}
.quest{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed #cfc7b4}
.quest:last-child{border-bottom:none}
.check{width:36px;height:36px;flex:none;border:3px solid var(--line);background:#fff;border-radius:10px;padding:0;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--ok);color:#fff}
.qtxt{flex:1;min-width:0}
.qtxt b{display:block}
.qtxt.done b{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;padding:1px 6px;border:2px solid var(--line);margin:3px 4px 0 0;color:#fff;border-radius:7px;
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
.small{font-size:.8rem;color:var(--muted)}
.rw{font-size:.8rem;text-align:right;white-space:nowrap}
.btn{display:block;width:100%;background:var(--gold);border:3px solid var(--line);box-shadow:3px 3px 0 #15121f;
  padding:12px;font-weight:700;margin:8px 0;color:var(--ink);border-radius:12px}
.btn.sec{background:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mbar{height:14px;border:2px solid var(--line);background:#fff;margin:8px 0 4px;border-radius:8px;overflow:hidden}
.mbar>i{display:block;height:100%}
.meta-h{display:flex;gap:10px;align-items:flex-start}
.meta-h .cor{width:10px;align-self:stretch;border:2px solid var(--line);flex:none;border-radius:6px}
.link{background:none;border:none;color:#3a5bd0;padding:6px 0;font-weight:600}
.vazio{color:#d8d2ea;text-align:center;padding:24px 10px}
.resumo{display:flex;justify-content:space-between;color:#fff;font-size:.85rem;margin:2px 2px 8px}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;background:#1b1730;border-top:3px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:none;color:#a59cc4;padding:10px 0 8px;font-size:.72rem}
nav button span{display:block;font-size:1.35rem}
nav button.on{color:var(--gold)}
nav button:not(.on) svg{opacity:.55}

/* folhas e janelas */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 24px)}
.sheet .card{margin-top:8px}
.sheet h3{color:#fff;margin:8px 0}
.days{display:flex;gap:4px}
.days button{flex:1;padding:10px 0;border:2px solid var(--line);background:#fff;font-weight:700;border-radius:10px;color:var(--ink)}
.days button.on{background:var(--gold)}
.ck{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:500}
.ck input{width:28px;height:28px;flex:none;padding:0;border-radius:8px;background:#fff}
.ck input:checked{background:var(--ok);box-shadow:inset 0 0 0 5px #fff}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.75);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{width:100%;max-width:380px;text-align:center}
.modal .big{font-size:2.6rem;margin:4px 0}
.modal h3{margin:6px 0}
.catlv{display:flex;align-items:center;gap:8px;margin:8px 0}
.catlv .nm{width:110px;font-size:.85rem}
.catlv .bar{flex:1;margin:0;background:#fff}
.catlv .n{width:44px;text-align:right;font-size:.85rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="modal"></div>

<script>
'use strict';
const VERSAO = '0.5.2';

/* ===================== CONFIGURAÇÕES DO JOGO ===================== */
const CATS = [
  {id:1,  nome:'Lazer',                   cor:'#f08c2a'},
  {id:2,  nome:'Social',                  cor:'#e04848'},
  {id:3,  nome:'Financeiras',             cor:'#e0b020'},
  {id:4,  nome:'Saúde',                   cor:'#4cb85c'},
  {id:5,  nome:'Acadêmicas',              cor:'#4a7fe0'},
  {id:6,  nome:'Profissionais',           cor:'#2bb8b0'},
  {id:7,  nome:'Família',                 cor:'#f07ab4'},
  {id:8,  nome:'Casa',                    cor:'#9a5ce0'},
  {id:9,  nome:'Desenvolvimento pessoal', cor:'#9a6a3c'},
  {id:10, nome:'Outros',                  cor:'#8a8a9a'},
];
const PRAZOS = {curto:'Curto (até 3 meses)', medio:'Médio (até 6 meses)', longo:'Longo (até 1 ano)', muito:'Muito longo (+1 ano)'};
const PRAZO_MESES = {curto:3, medio:6, longo:12, muito:24};
function fimPadrao(inicio, prazo){ const d = parseKey(inicio); d.setMonth(d.getMonth() + PRAZO_MESES[prazo]); d.setDate(d.getDate()-1); return keyOf(d); }
const PRAZO_CURTO = {curto:'Curto', medio:'Médio', longo:'Longo', muito:'Muito longo'};
const DIF = {
  f:  {nome:'Fácil',         xp:10,  m:2},
  m:  {nome:'Médio',         xp:25,  m:5},
  d:  {nome:'Difícil',       xp:50,  m:10},
  md: {nome:'Muito difícil', xp:100, m:20},
};
const BONUS_META = {
  curto: {xp:150,  m:50,  bau:0},
  medio: {xp:300,  m:100, bau:0},
  longo: {xp:600,  m:200, bau:1},
  muito: {xp:1000, m:400, bau:1},
};
const LEVELUP_MOEDAS = 50;
const EXTRA_MOEDAS = 3, EXTRA_MAX_PAGAS = 3;
const VIRADA_HORA = 5;
const BONUS_SEMANAL = 0.15, SEMANA_MAX_FALHAS = 1;   // semana com pelo menos 6 de 7 dias cumpridos → +15% do XP de quests
const ESCUDOS_MAX = 3, ESCUDO_EXCEDENTE_MOEDAS = 200;
const VIDA_REAL_ATIVA = false;   // aba Vida real da Loja: pronta, mas mostrando "Em breve" por enquanto
const ITENS = {
  escudo:     {nome:'Escudo',                 preco:500, max:ESCUDOS_MAX, desc:'Protege a sequência em 1 dia não cumprido. O app pergunta antes de usar.'},
  pergaminho: {nome:'Pergaminho de adiamento', preco:50,  max:5, desc:'Passa 1 quest diária para amanhã, sem penalidade. Use tocando no nome da quest.'},
  dado:       {nome:'Dado da troca',           preco:100, max:5, desc:'Troca 1 quest do dia: sorteia outra da mesma meta; se não houver, você escreve a troca (vale o mesmo XP). Use tocando no nome da quest.'},
};   // escudo ganho com estoque cheio vira moedas
const SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FREQ = {dias:'Diária (dias da semana)', semanal:'Semanal', mensal:'Mensal', bimestral:'Bimestral', anual:'Anual'};
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ===================== DATAS (dia vira às 05h) ===================== */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const hoje = () => keyOf(new Date(Date.now() - VIRADA_HORA*3600e3));
const addDias = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diaSemana = k => parseKey(k).getDay();
const fmtCurta = k => { const d = parseKey(k); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const diasEntre = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
function periodo(freq, k = hoje()){
  const d = parseKey(k), y = d.getFullYear(), m = d.getMonth();
  if (freq === 'semanal'){ const ini = addDias(k, -((d.getDay()+6)%7)), fim = addDias(ini, 6);
    return {key:'S'+ini, ini, fim, nome:`Semana de ${fmtCurta(ini)} a ${fmtCurta(fim)}`}; }
  if (freq === 'mensal') return {key:`M${y}-${m}`, ini:keyOf(new Date(y,m,1)), fim:keyOf(new Date(y,m+1,0)), nome:`${MESES[m]} de ${y}`};
  if (freq === 'bimestral'){ const b = Math.floor(m/2);
    return {key:`B${y}-${b}`, ini:keyOf(new Date(y,2*b,1)), fim:keyOf(new Date(y,2*b+2,0)), nome:`${MESES[2*b]} e ${MESES[2*b+1]} de ${y}`}; }
  return {key:`A${y}`, ini:`${y}-01-01`, fim:`${y}-12-31`, nome:`Ano de ${y}`};
}
const fmtData = k => { const d = parseKey(k); return `${SEMANA[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };

/* ===================== ESTADO ===================== */
const CHAVE = 'lifeup';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function novoEstado(){
  return { v:1, criado:hoje(), metas:[], quests:[], dias:{}, xp:0, moedas:0, catXp:{}, baus:0,
           seq:{atual:0, recorde:0, ultimo:addDias(hoje(),-1)} };
}
function migrar(){
  // completa campos que versões antigas não tinham
  if (!S.per) S.per = {};
  S.metas.forEach(m => { if (!m.fim) m.fim = fimPadrao(m.criada || hoje(), m.prazo); });
  if (S.escudos == null) S.escudos = 0;
  if (!S.res) S.res = {};          // resultado de cada dia: ok / escudo / falha
  if (!S.sem) S.sem = {};          // ganhos de cada semana (XP, XP de quests, moedas)
  if (!S.resumos) S.resumos = {};  // resumos das semanas fechadas
  if (!S.semFechada) S.semFechada = addDias(periodo('semanal').ini, -7);
  if (!S.itens) S.itens = {pergaminho:0, dado:0};
  if (!S.adiadas) S.adiadas = {};      // dia → quests adiadas para ele
  if (!S.recompensas) S.recompensas = [];
  if (!S.resgates) S.resgates = [];
}
let S;
try { S = JSON.parse(localStorage.getItem(CHAVE)) || novoEstado(); } catch(e){ S = novoEstado(); }
const salvar = () => localStorage.setItem(CHAVE, JSON.stringify(S));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

const ui = { tab:'missoes', sub:'dias', filtro:'todas', aberta:null, loja:'itens' };
migrar();
const cat = id => CATS.find(c => c.id === +id) || CATS[9];
const meta = id => S.metas.find(m => m.id === id);
const quest = id => S.quests.find(q => q.id === id);
const qidDe = k => String(k).split('@')[0];   // 'abc@ad' = quest adiada do dia anterior
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (Math.round(n*100)/100).toLocaleString('pt-BR');

/* ===================== NÍVEIS ===================== */
// XP para ir do nível N ao N+1 = 200 + 100 × (N − 1)
function nivel(xp){
  let n = 1, need = 200;
  while (xp >= need){ xp -= need; n++; need = 200 + 100*(n-1); }
  return { n, dentro:xp, need };
}
function bonusSeq(){
  const a = S.seq.atual;
  return a >= 100 ? .30 : a >= 30 ? .20 : a >= 7 ? .10 : 0;
}

/* ===================== AGENDA DO DIA E SEQUÊNCIA ===================== */
function metaViva(m){ return m && m.status !== 'nao'; }
function agendadas(k){
  const wd = diaSemana(k);
  return S.quests.filter(q => q.ativa && q.criada <= k && (q.freq||'dias') === 'dias' &&
    (q.dias.length === 0 || q.dias.includes(wd)) &&
    q.metas.some(id => metaViva(meta(id))));
}
function folga(n){ return Math.max(1, Math.floor(n*0.2)); }
function diaCumprido(d){
  // null = dia sem quests (não conta)
  const r = S.dias[d];
  const n = r ? r.prog.length : (d >= S.criado ? agendadas(d).length + (S.adiadas[d]||[]).length : 0);
  if (!n) return null;
  const feitas = r ? r.prog.filter(id => r.feitas[id]).length : 0;
  return feitas >= 1 && n - feitas <= folga(n);
}
const resultadoDia = d => S.res[d] || (d < hoje() ? ({true:'ok', false:'falha'})[diaCumprido(d)] : null) || null;
function avaliarSequencia(){
  // avalia os dias até ontem; se um dia falhou e dá para usar escudo, para e devolve esse dia (o usuário decide)
  const h = hoje();
  let d = addDias(S.seq.ultimo, 1);
  while (d < h){
    const ok = diaCumprido(d);
    if (ok === true){
      S.seq.atual++; S.seq.recorde = Math.max(S.seq.recorde, S.seq.atual); S.res[d] = 'ok';
    } else if (ok === false){
      if (S.seq.atual > 0 && S.escudos > 0) return d;
      S.seq.atual = 0; S.res[d] = 'falha';
    }
    S.seq.ultimo = d;
    d = addDias(d, 1);
  }
  S.seq.ultimo = addDias(h, -1);
  return null;
}
function decidirEscudo(d, usar){
  if (usar){ S.escudos--; S.res[d] = 'escudo'; }
  else { S.seq.atual = 0; S.res[d] = 'falha'; }
  S.seq.ultimo = d;
}
const perguntarEscudo = d => new Promise(res => {
  filaAvisos = filaAvisos.then(() => janela(`<div class="big">${ic('escudo','64px')}</div><h3 class="px">USAR ESCUDO?</h3>
    <p><b>${fmtData(d)}</b> não foi cumprido.</p>
    <p>Usar 1 escudo para manter sua sequência de <b>${S.seq.atual}</b> ${ic('fogo')}?</p>
    <p class="small">Você tem ${S.escudos}/${ESCUDOS_MAX}. Se não usar, a sequência zera e o escudo fica guardado.</p>`,
    [{txt:'Usar escudo', ret:true}, {txt:'Deixar zerar', cls:'sec', ret:false}]).then(res));
});
async function processarSequencia(){
  let d;
  while ((d = avaliarSequencia())){ const usar = await perguntarEscudo(d); decidirEscudo(d, usar); salvar(); }
}
function diaDeHoje(){
  const h = hoje();
  if (!S.dias[h]) S.dias[h] = { prog: [...agendadas(h).map(q => q.id), ...(S.adiadas[h]||[])], feitas:{}, extras:[], fora:[], dentro:[] };
  return S.dias[h];
}
function sincronizarHoje(){
  // após criar/editar/apagar quests, ajusta a lista de hoje (sem mexer no que já foi feito)
  const r = diaDeHoje(), h = hoje();
  const fora = r.fora || [], dentro = r.dentro || [];
  const devem = new Set(agendadas(h).map(q => q.id).filter(id => !fora.includes(id)));
  r.prog = r.prog.filter(id => r.feitas[id] || (String(id).includes('@') || dentro.includes(id) ? !!quest(qidDe(id)) : devem.has(id)));
  devem.forEach(id => { if (!r.prog.includes(id)) r.prog.push(id); });
}
let diaAtual = null, virando = false;
async function checarVirada(){
  if (virando || diaAtual === hoje()) return;
  virando = true;
  try { await processarSequencia(); fecharPeriodos(); fecharSemanas(); diaDeHoje(); diaAtual = hoje(); salvar(); render(); }
  finally { virando = false; }
}

/* ===================== GANHOS (XP, moedas, baús) ===================== */
const semAtual = () => periodo('semanal').ini;
function logSem(wk, xp, xq, m, qc, sinal=1){
  const L = S.sem[wk] || (S.sem[wk] = {xp:0, xq:0, m:0, qc:{}});
  L.xp += sinal*xp; L.xq += sinal*xq; L.m += sinal*m;
  for (const c in qc) L.qc[c] = (L.qc[c]||0) + sinal*qc[c];
}
function aplicar(g, sinal=1){
  S.xp += sinal*g.xp;
  for (const c in g.cats) S.catXp[c] = (S.catXp[c]||0) + sinal*g.cats[c];
  S.moedas += sinal*g.moedas;
  S.baus += sinal*g.baus;
  if (!g.sem) g.sem = semAtual();   // semana em que o ganho entrou (desfazer tira da mesma semana)
  logSem(g.sem, g.xp, g.xq||0, g.moedas, g.qc||{}, sinal);
}
function somarXP(g, xp, cats){ g.xp += xp; cats.forEach(c => g.cats[c] = (g.cats[c]||0) + xp); }
// XP vindo de quest (base do bônus semanal)
function somarXPQuest(g, xp, cats){ somarXP(g, xp, cats); g.xq = (g.xq||0) + xp; g.qc = g.qc || {}; cats.forEach(c => g.qc[c] = (g.qc[c]||0) + xp); }
function fecharLevel(g){
  // calcula level up que este ganho provoca e já inclui as recompensas
  const antes = nivel(S.xp).n, depois = nivel(S.xp + g.xp).n;
  const lv = Math.max(0, depois - antes);
  g.moedas += lv*LEVELUP_MOEDAS; g.baus += lv; g.lv = lv; g.nivelNovo = depois;
  return g;
}
const ganhoVazio = () => ({xp:0, cats:{}, moedas:0, baus:0, lv:0});
function bonusMeta(g, m){
  const b = BONUS_META[m.prazo];
  somarXP(g, b.xp, [m.cat]); g.moedas += b.m; g.baus += b.bau;
}

/* ===================== AÇÕES ===================== */
async function concluirQuest(id){
  const q = quest(qidDe(id)), r = diaDeHoje();
  if (!q || r.feitas[id]) return;
  const autos = q.metas.map(meta).filter(m => m && m.tipo === 'auto' && m.status !== 'nao');
  let valor = 0;
  if (autos.length){
    const un = autos[0].unidade ? ` (${autos[0].unidade})` : '';
    valor = await pedirNumero(`Quanto foi?${un}`, q.valor || 1, `Soma em: ${autos.map(m=>esc(m.titulo)).join(', ')}`);
    if (valor === null) return;
  }
  const g = ganhoVazio();
  const cats = [...new Set(q.metas.map(meta).filter(Boolean).map(m => m.cat))];
  const xpQuest = Math.round(DIF[q.dif].xp * (1 + bonusSeq()));
  somarXPQuest(g, xpQuest, cats);
  g.moedas += DIF[q.dif].m;
  const concl = [];
  autos.forEach(m => {
    m.progresso += valor;
    if (m.status === 'ativa' && m.progresso >= m.alvo){ m.status = 'cumprida'; m.concluida = hoje(); bonusMeta(g, m); concl.push(m.id); }
  });
  fecharLevel(g); aplicar(g);
  r.feitas[id] = { g, xpQuest, valor, metas: autos.map(m=>m.id), concl };
  salvar(); render();
  concl.forEach(mid => avisoMeta(meta(mid)));
  if (g.lv) avisoLevel(g);
}
function desfazerQuest(id){
  const r = diaDeHoje(), e = r.feitas[id];
  if (!e) return;
  aplicar(e.g, -1);
  e.metas.forEach(mid => { const m = meta(mid); if (m) m.progresso -= e.valor; });
  e.concl.forEach(mid => { const m = meta(mid); if (m && m.status === 'cumprida'){ m.status = 'ativa'; m.concluida = null; } });
  delete r.feitas[id];
  salvar(); render();
}
function toggleExtra(id){
  const r = diaDeHoje(), e = r.extras.find(x => x.id === id);
  if (!e) return;
  if (!e.feita){
    const pagas = r.extras.filter(x => x.feita && x.moedas > 0).length;
    e.moedas = pagas < EXTRA_MAX_PAGAS ? EXTRA_MOEDAS : 0;
    S.moedas += e.moedas; e.feita = true; e.sem = semAtual(); logSem(e.sem, 0, 0, e.moedas, {});
  } else {
    S.moedas -= e.moedas; logSem(e.sem || semAtual(), 0, 0, e.moedas, {}, -1); e.moedas = 0; e.feita = false;
  }
  salvar(); render();
}
function metaManual(id, resultado){
  const m = meta(id); if (!m) return;
  if (resultado === 'cumprida'){
    const g = ganhoVazio(); bonusMeta(g, m); fecharLevel(g); aplicar(g);
    m.status = 'cumprida'; m.concluida = hoje(); m.ganho = g;
    salvar(); render(); avisoMeta(m); if (g.lv) avisoLevel(g);
  } else {
    m.status = 'nao'; m.concluida = hoje(); sincronizarHoje(); salvar(); render();
  }
}
function reabrirMeta(id){
  const m = meta(id); if (!m) return;
  if (m.status === 'cumprida' && m.ganho){ aplicar(m.ganho, -1); m.ganho = null; }
  m.status = 'ativa'; m.concluida = null;
  sincronizarHoje(); salvar(); render();
}

/* ===================== QUESTS PERIÓDICAS ===================== */
// Recálculo: alvo do período = maior entre o valor original e (quanto falta na meta ÷ períodos restantes até a data final)
function periodosRestantes(freq, ate){
  let k = hoje(), n = 0;
  while (k <= ate && n < 1000){ n++; k = addDias(periodo(freq, k).fim, 1); }
  return n;
}
function alvoDoPeriodo(q){
  const m = q.metas.map(meta).find(m => m && m.tipo === 'auto' && m.status === 'ativa' && m.fim && m.fim >= hoje());
  if (!m) return q.valor;
  const n = periodosRestantes(q.freq, m.fim);
  const falta = Math.max(0, m.alvo - m.progresso);
  return n > 0 ? Math.max(q.valor, Math.ceil(falta / n * 100) / 100) : q.valor;
}
function perDe(q){
  const p = periodo(q.freq), k = q.id + '|' + p.key;
  if (!S.per[k]) S.per[k] = { qid:q.id, fim:p.fim, feito:0, alvo:alvoDoPeriodo(q), regs:[], completa:false, fechado:false };
  return S.per[k];
}
const alvoPer = (e, q) => e.alvo ?? q.valor;
async function registrar(id){
  const q = quest(id); if (!q) return;
  const e = perDe(q);
  const autos = q.metas.map(meta).filter(m => m && m.tipo === 'auto' && m.status !== 'nao');
  const falta = Math.max(0, alvoPer(e,q) - e.feito);
  const padrao = autos.length ? (falta || alvoPer(e,q)) : 1;
  const un = autos.length && autos[0].unidade ? ` (${esc(autos[0].unidade)})` : (autos.length ? '' : ' (vezes)');
  const v = await pedirNumero(`Quanto foi?${un}`, padrao, `${esc(q.titulo)}${autos.length?` · soma em: ${autos.map(m=>esc(m.titulo)).join(', ')}`:''}`);
  if (v === null || v === 0) return;
  const g = ganhoVazio(), reg = { v, metas: autos.map(m=>m.id), concl:[], completou:false };
  e.feito += v;
  autos.forEach(m => {
    m.progresso += v;
    if (m.status === 'ativa' && m.progresso >= m.alvo){ m.status = 'cumprida'; m.concluida = hoje(); bonusMeta(g, m); reg.concl.push(m.id); }
  });
  if (!e.completa && e.feito >= alvoPer(e,q)){
    const cats = [...new Set(q.metas.map(meta).filter(Boolean).map(m => m.cat))];
    reg.xpQuest = Math.round(DIF[q.dif].xp * (1 + bonusSeq()));
    somarXPQuest(g, reg.xpQuest, cats); g.moedas += DIF[q.dif].m;
    e.completa = true; reg.completou = true;
  }
  fecharLevel(g); aplicar(g); reg.g = g; e.regs.push(reg);
  salvar(); render();
  if (reg.completou) avisar(`<div class="big">${ic('check','56px').replace(/#f4f0e6/g,'#4cb85c')}</div><h3>Quest completa!</h3><p><b>${esc(q.titulo)}</b></p><p>+${reg.xpQuest} XP · +${DIF[q.dif].m} ${ic('moeda')}</p>`);
  reg.concl.forEach(mid => avisoMeta(meta(mid)));
  if (g.lv) avisoLevel(g);
}
function desfazerRegistro(id){
  const q = quest(id); if (!q) return;
  const e = perDe(q), reg = e.regs.pop(); if (!reg) return;
  aplicar(reg.g, -1);
  e.feito -= reg.v;
  reg.metas.forEach(mid => { const m = meta(mid); if (m) m.progresso -= reg.v; });
  reg.concl.forEach(mid => { const m = meta(mid); if (m && m.status === 'cumprida'){ m.status = 'ativa'; m.concluida = null; } });
  if (reg.completou) e.completa = false;
  salvar(); render();
}
function fecharPeriodos(){
  // período terminou sem completar: XP proporcional, sem moedas
  const h = hoje();
  for (const k in S.per){
    const e = S.per[k];
    if (e.fechado || e.fim >= h) continue;
    e.fechado = true;
    const q = quest(e.qid);
    if (e.completa || !q) continue;
    // regra: período não completado = XP proporcional ao que foi feito, sem moedas;
    // fica marcada como incompleta para o relatório e é recalculada na revisão bimestral
    e.falhou = true;
    const frac = Math.min(1, Math.max(0, e.feito / alvoPer(e,q)));
    const g = ganhoVazio(); g.sem = periodo('semanal', e.fim).ini;
    const cats = [...new Set(q.metas.map(meta).filter(Boolean).map(m => m.cat))];
    e.parcial = Math.round(DIF[q.dif].xp * frac);
    if (e.parcial > 0){ somarXPQuest(g, e.parcial, cats); fecharLevel(g); aplicar(g); }
    avisar(`<h3>Quest incompleta</h3><p><b>${esc(q.titulo)}</b>: ${num(e.feito)} de ${num(alvoPer(e,q))} (${Math.round(frac*100)}%)</p>
      <p>+${e.parcial} XP proporcional · sem moedas</p><p class="small">Vai para o relatório da revisão bimestral.</p>`);
    if (g.lv) avisoLevel(g);
  }
}

/* ===================== SEMANA: BÔNUS, ESCUDO E RESUMO ===================== */
function semanaDias(ini){ return [0,1,2,3,4,5,6].map(i => addDias(ini, i)); }
function contarSemana(ini){
  const dias = semanaDias(ini).map(d => ({d, r: resultadoDia(d)}));
  const ok = dias.filter(x => x.r === 'ok').length;
  const falhas = dias.filter(x => x.r === 'falha' || x.r === 'escudo').length;
  return { dias, ok, falhas, comQuest: ok + falhas };
}
function catsDaSemana(L){
  const ativas = new Set(S.metas.filter(m => m.status === 'ativa').map(m => +m.cat));
  const qc = L ? L.qc : {};
  let dest = null, aten = null;
  CATS.forEach(c => {
    const v = qc[c.id] || 0;
    if (v > 0 && (!dest || v > dest.v)) dest = {c, v};
    if (ativas.has(c.id) && (!aten || v < aten.v)) aten = {c, v};
  });
  if (ativas.size < 2 || (aten && dest && aten.c.id === dest.c.id)) aten = null;
  return { dest, aten };
}
function fecharSemana(ini, mostrar){
  const c = contarSemana(ini), L = S.sem[ini] || {xp:0, xq:0, m:0, qc:{}};
  const R = { ini, ok:c.ok, falhas:c.falhas, comQuest:c.comQuest, dias:c.dias.map(x => x.r), bonus:0, escudo:0, cheio:false };
  // semana cumprida (no máximo 1 dia falho): bônus de +15% do XP de quests e +1 escudo
  if (c.comQuest > 0 && c.falhas <= SEMANA_MAX_FALHAS){
    const g = ganhoVazio(); g.sem = ini;
    g.xp = Math.round(L.xq * BONUS_SEMANAL);
    for (const k in L.qc) g.cats[k] = Math.round(L.qc[k] * BONUS_SEMANAL);
    if (ganharEscudo(g)) R.escudo = 1; else R.cheio = true;
    fecharLevel(g); aplicar(g);
    R.bonus = g.xp; if (g.lv) R.lv = g;
  }
  const L2 = S.sem[ini] || L;
  R.xp = L2.xp; R.moedas = L2.m; R.seq = S.seq.atual; R.recorde = S.seq.recorde; R.escudos = S.escudos;
  const cs = catsDaSemana(L2);
  R.dest = cs.dest ? cs.dest.c.id : null; R.aten = cs.aten ? cs.aten.c.id : null;
  S.resumos[ini] = R;
  if (mostrar) avisoResumo(R);
  if (R.lv && mostrar) avisoLevel(R.lv);
}
function ganharEscudo(g){
  // vale para semana, baú e conquistas: com estoque cheio, o escudo vira moedas
  if (S.escudos < ESCUDOS_MAX){ S.escudos++; return true; }
  g.moedas += ESCUDO_EXCEDENTE_MOEDAS; return false;
}
function fecharSemanas(){
  const h = hoje();
  let ini = addDias(S.semFechada, 7);
  while (addDias(ini, 6) < h){
    fecharSemana(ini, addDias(ini, 13) >= h);   // mostra só o resumo da semana mais recente
    S.semFechada = ini; ini = addDias(ini, 7);
  }
}
const COR_DIA = {ok:'#4cb85c', escudo:'#4a7fe0', falha:'#e04848'};
function tirinhaDias(ini, rs, destacar){
  return `<div style="display:flex;gap:4px;margin:8px 0">${semanaDias(ini).map((d,i) => {
    const r = rs[i], hj = destacar && d === hoje();
    return `<div style="flex:1;text-align:center"><div class="small">${SEMANA[diaSemana(d)][0]}</div>
      <div style="height:22px;border:2px solid var(--line);border-radius:6px;background:${COR_DIA[r]||(hj?'#fff':'#d8d2c4')};${hj?'box-shadow:0 0 0 2px var(--gold)':''}">${r==='escudo'?ic('escudo','16px'):''}</div></div>`;
  }).join('')}</div>`;
}
function htmlResumo(R){
  const fim = addDias(R.ini, 6);
  const linha = (a, b) => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:2px dashed #cfc7b4"><span>${a}</span><b>${b}</b></div>`;
  let h = `<h3 class="px">RESUMO DA SEMANA</h3><div class="small">${fmtCurta(R.ini)} a ${fmtCurta(fim)}</div>
    ${tirinhaDias(R.ini, R.dias)}<div style="text-align:left">`;
  h += linha('Dias cumpridos', R.comQuest ? `${R.ok} de ${R.comQuest}` : 'sem quests');
  h += linha('XP ganho', `+${R.xp}`);
  h += linha('Bônus semanal', R.bonus ? `+${R.bonus} XP` : (R.comQuest ? `perdido (${R.falhas} dias falhos)` : '—'));
  h += linha(`Moedas`, `+${R.moedas} ${ic('moeda')}`);
  h += linha(`Sequência`, `${R.seq} ${ic('fogo')} (recorde ${R.recorde})`);
  h += linha(`Escudo`, R.escudo ? `+1 ${ic('escudo')} (${R.escudos}/${ESCUDOS_MAX})`
    : R.cheio ? `estoque cheio → +${ESCUDO_EXCEDENTE_MOEDAS} ${ic('moeda')}`
    : R.comQuest ? 'não ganhou' : '—');
  if (R.dest) h += linha('Destaque', `<span class="tag" style="background:${cat(R.dest).cor}">${cat(R.dest).nome}</span>`);
  if (R.aten) h += linha('Atenção', `<span class="tag" style="background:${cat(R.aten).cor}">${cat(R.aten).nome}</span>`);
  return h + `</div>`;
}
function avisoResumo(R){ avisar(htmlResumo(R)); }

/* ===================== LOJA E ITENS ===================== */
const qtdItem = k => k === 'escudo' ? S.escudos : (S.itens[k]||0);
async function comprar(k){
  const it = ITENS[k];
  if (S.moedas < it.preco || qtdItem(k) >= it.max) return;
  if (!(await confirmar(`Comprar ${it.nome} por ${it.preco} moedas?`, 'Comprar'))) return;
  S.moedas -= it.preco;
  if (k === 'escudo') S.escudos++; else S.itens[k] = (S.itens[k]||0) + 1;
  salvar(); render();
}
async function acoesQuest(k){
  const q = quest(qidDe(k)), r = diaDeHoje();
  if (!q || r.feitas[k]) return;
  const p = S.itens.pergaminho||0, d = S.itens.dado||0;
  const ops = [];
  if (p) ops.push({txt:`Adiar para amanhã (pergaminho · tem ${p})`, ret:'adiar'});
  if (d) ops.push({txt:`Trocar por outra (dado · tem ${d})`, ret:'trocar'});
  if (!p || !d) ops.push({txt:'Ir para a Loja', cls:'sec', ret:'loja'});
  ops.push({txt:'Cancelar', cls:'sec', ret:null});
  const v = await janela(`<h3>${esc(q.titulo)}</h3>${tagsMetas(q.metas)}
    ${!p && !d ? '<p class="small">Você não tem pergaminho nem dado. Compre na Loja.</p>' : ''}`, ops);
  if (v === 'adiar') adiarQuest(k);
  if (v === 'trocar') trocarQuest(k);
  if (v === 'loja'){ ui.tab = 'loja'; ui.loja = 'itens'; render(); }
}
function adiarQuest(k){
  const r = diaDeHoje(), am = addDias(hoje(), 1), nk = qidDe(k) + '@ad';
  if (!(S.itens.pergaminho > 0) || r.feitas[k]) return;
  S.adiadas[am] = S.adiadas[am] || [];
  if (S.adiadas[am].includes(nk)) return janela('<h3>Essa quest já está adiada para amanhã</h3>', [{txt:'Ok', ret:1}]);
  S.adiadas[am].push(nk); S.itens.pergaminho--;
  r.prog = r.prog.filter(x => x !== k);
  (r.fora = r.fora || []).push(k);
  (r.adiou = r.adiou || []).push(qidDe(k));
  salvar(); render();
  avisar(`<div class="big">${ic('pergaminho','64px')}</div><h3>Quest adiada</h3><p><b>${esc(quest(qidDe(k)).titulo)}</b> vai aparecer amanhã.</p><p class="small">Hoje ela não conta para a sequência.</p>`);
}
function opcoesTroca(k){
  const q = quest(qidDe(k)), r = diaDeHoje(), usadas = new Set([...r.prog, ...(r.fora||[])].map(qidDe));   // não sorteia quest já tirada do dia
  return S.quests.filter(o => o.ativa && !o.avulsa && o.id !== q.id && (o.freq||'dias') === 'dias' &&
    o.metas.some(m => q.metas.includes(m)) && !usadas.has(o.id) && o.metas.some(id => metaViva(meta(id))));
}
async function trocarQuest(k){
  const r = diaDeHoje(), q = quest(qidDe(k));
  if (!(S.itens.dado > 0) || r.feitas[k] || !q) return;
  const ops = opcoesTroca(k);
  let nova;
  if (ops.length){
    // 1º: sorteia outra quest diária da mesma meta (qualquer dificuldade)
    nova = ops[Math.floor(Math.random() * ops.length)];
  } else {
    // 2º: não há o que sortear → você escreve a troca (mesma meta, mesmo XP e moedas)
    const t = await janela(`<div class="big">${ic('dado','56px')}</div><h3>Escreva a troca</h3>
      <p class="small">Não há outra quest da mesma meta para sortear. O que você vai fazer no lugar de <b>${esc(q.titulo)}</b>?</p>
      <input id="trocaTxt" placeholder="Ex.: Nadar 30 min" style="margin-top:6px">
      <p class="small">Vale o mesmo: ${DIF[q.dif].nome} · +${DIF[q.dif].xp} XP · +${DIF[q.dif].m} moedas.</p>`,
      [{txt:'Trocar', val:() => document.getElementById('trocaTxt').value.trim()}, {txt:'Cancelar', cls:'sec', ret:null}]);
    if (!t) return;
    nova = { id:uid(), titulo:t, metas:[...q.metas], dif:q.dif, freq:'dias', dias:[], valor:q.valor, ativa:false, avulsa:true, criada:hoje() };
    S.quests.push(nova);
  }
  S.itens.dado--;
  r.prog = r.prog.map(x => x === k ? nova.id : x);
  (r.fora = r.fora || []).push(k);
  (r.dentro = r.dentro || []).push(nova.id);
  salvar(); render();
  avisar(`<div class="big">${ic('dado','64px')}</div><h3>${nova.avulsa ? 'Troca feita:' : 'Saiu no dado:'}</h3><p><b>${esc(nova.titulo)}</b></p>${tagsMetas(nova.metas)}`);
}

const _icCache = {};
function ic(nome, tam='1.15em'){
  if (!_icCache[nome]){
    const art = ICONES[nome], n = art.length; let r = '';
    art.forEach((l,y) => [...l].forEach((c,x) => { if (ICOR[c]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${ICOR[c]}"/>`; }));
    _icCache[nome] = `viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${r}</svg>`;
  }
  return `<svg class="ic" style="width:${tam};height:${tam}" ${_icCache[nome]}`;
}

function telaMissoes(){
  const r = diaDeHoje();
  const qs = r.prog.map(k => ({k, q:quest(qidDe(k))})).filter(x => x.q);
  const feitas = qs.filter(x => r.feitas[x.k]).length;
  const n = qs.length;
  let status = '';
  if (n){
    const falta = n - feitas, f = folga(n);
    status = (feitas >= 1 && falta <= f) ? `${ic('check','1em').replace(/#f4f0e6/g,'#4cb85c')} Dia garantido para a sequência` : `Faltam ${Math.max(1, falta - f)} para garantir a sequência`;
  }
  const subs = {dias:'Diária', semanal:'Semanal', mensal:'Mensal', bimestral:'Bimestral', anual:'Anual'};
  let h = `<div class="sub">${Object.entries(subs).map(([k,v]) => `<button class="chip ${ui.sub===k?'on':''}" data-a="sub" data-id="${k}">${v}</button>`).join('')}</div>`;
  if (ui.sub !== 'dias') return h + telaPeriodicas(ui.sub);
  h += `<div class="resumo"><span>${fmtData(hoje())}</span><span>${feitas}/${n} feitas</span></div>`;
  if (!S.metas.length){
    h += `<div class="card"><b>Bem-vindo ao Life UP!</b><p>Comece criando uma meta na aba <b>Metas</b>. Depois adicione quests a ela: as quests do dia aparecem aqui.</p>
      <button class="btn" data-a="tab" data-id="metas">Ir para Metas</button></div>`;
  } else if (!n){
    h += `<div class="card vazio" style="color:var(--muted)">Nenhuma quest para hoje.${(r.adiou||[]).length?`<br><span class="small">${ic('pergaminho')} Adiada para amanhã: ${r.adiou.map(id => esc((quest(id)||{}).titulo||'')).join(', ')}</span>`:''}<br><span class="small">Adicione quests nas suas metas (aba Metas).</span></div>`;
  } else {
    h += `<div class="card">${qs.map(({k, q}) => {
      const e = r.feitas[k];
      const xp = e ? (e.xpQuest ?? e.g.xp) : Math.round(DIF[q.dif].xp*(1+bonusSeq()));
      return `<div class="quest">

        <div class="rw">${DIF[q.dif].nome}<br><b>+${xp} XP</b></div></div>`;
    }).join('')}<div class="small" style="margin-top:8px">${status}</div>
    ${(r.adiou||[]).length ? `<div class="small" style="margin-top:4px">${ic('pergaminho')} Adiada para amanhã: ${r.adiou.map(id => esc((quest(id)||{}).titulo||'')).join(', ')}</div>`:''}
    <div class="small" style="margin-top:4px">Toque no nome de uma quest para adiar ou trocar.</div></div>`;
  }
  // extras
  const pagas = r.extras.filter(x => x.feita && x.moedas > 0).length;
  h += `<h2>Quests extras <span class="small" style="color:#cfc8e6">(imprevistos do dia · só moedas)</span></h2><div class="card">`;
  h += r.extras.length ? r.extras.map(x => `<div class="quest">
      <button class="check ${x.feita?'on':''}" data-a="extra" data-id="${x.id}">${x.feita?ic('check','26px'):''}</button>
      <div class="qtxt ${x.feita?'done':''}"><b>${esc(x.titulo)}</b>${x.meta?tagsMetas([x.meta]):''}</div>
      <div class="rw">${x.feita ? (x.moedas?`+${x.moedas} ${ic('moeda')}`:'sem moedas') : (pagas<EXTRA_MAX_PAGAS?`+${EXTRA_MOEDAS} ${ic('moeda')}`:'sem moedas')}<br>
      <button class="link" data-a="apagarExtra" data-id="${x.id}">apagar</button></div></div>`).join('')
    : `<div class="small">Nenhuma ainda hoje. Valem ${EXTRA_MOEDAS} ${ic('moeda')} cada, até ${EXTRA_MAX_PAGAS} por dia.</div>`;
  h += `<button class="btn sec" data-a="novaExtra">+ Quest extra</button></div>`;
  return h;
}
function telaPeriodicas(freq){
  const p = periodo(freq), h0 = hoje();
  const restam = diasEntre(h0, p.fim) + 1;
  const qs = S.quests.filter(q => q.ativa && q.freq === freq && q.metas.some(id => metaViva(meta(id))));
  let h = `<div class="resumo"><span>${p.nome}</span><span>${restam} dia${restam>1?'s':''} restante${restam>1?'s':''}</span></div>`;
  if (freq === 'semanal') h += painelSemana(p.ini);
  if (!qs.length) return h + `<div class="card vazio" style="color:var(--muted)">Nenhuma quest ${FREQ[freq].toLowerCase()}.<br><span class="small">Crie nas suas metas (aba Metas → Quests → + Quest) escolhendo a frequência.</span></div>`;
  return h + qs.map(q => {
    const e = perDe(q);
    const autos = q.metas.map(meta).filter(m => m && m.tipo === 'auto');
    const un = autos.length ? esc(autos[0].unidade||'') : 'vezes';
    const pct = Math.min(100, e.feito / alvoPer(e,q) * 100);
    const xp = Math.round(DIF[q.dif].xp*(1+bonusSeq()));
    return `<div class="card"><div class="quest" style="padding-top:0">
      <div class="qtxt ${e.completa?'':''}"><b>${esc(q.titulo)}</b>${tagsMetas(q.metas)}</div>
      <div class="rw">${DIF[q.dif].nome}<br><b>${e.completa ? 'Completa' : `+${xp} XP`}</b></div></div>
      <div class="mbar"><i style="width:${pct}%;background:${e.completa?'var(--ok)':'var(--gold)'}"></i></div>
      <div class="small">${num(e.feito)} / ${num(alvoPer(e,q))} ${un}${e.completa?' · completa!':''}${alvoPer(e,q) > q.valor ? ` · recalculado (original ${num(q.valor)})`:''}</div>
      <div class="row"><button class="btn ${e.completa?'sec':''}" data-a="registrar" data-id="${q.id}">+ Registrar</button>
      ${e.regs.length?`<button class="btn sec" data-a="desfazerReg" data-id="${q.id}">Desfazer último</button>`:''}</div></div>`;
  }).join('');
}
function painelSemana(ini){
  const c = contarSemana(ini), L = S.sem[ini] || {xq:0};
  const restFalhas = SEMANA_MAX_FALHAS - c.falhas;
  const bon = c.falhas > SEMANA_MAX_FALHAS ? `<span style="color:var(--bad)">perdido nesta semana</span>`
    : `+${Math.round(L.xq*BONUS_SEMANAL)} XP até agora · ${restFalhas ? 'pode falhar mais 1 dia' : 'não pode falhar mais nenhum dia'}`;
  const esc_ = c.falhas > SEMANA_MAX_FALHAS ? `<span style="color:var(--bad)">perdido nesta semana</span>`
    : S.escudos >= ESCUDOS_MAX ? `estoque cheio: vira +${ESCUDO_EXCEDENTE_MOEDAS} ${ic('moeda')} se falhar no máx. 1 dia`
    : `+1 no fim da semana se falhar no máx. 1 dia`;
  const ult = S.resumos[addDias(ini, -7)];
  return `<div class="card"><b>Esta semana</b>${tirinhaDias(ini, c.dias.map(x => x.r), true)}
    <div class="small">${ic('subir')} <b>Bônus semanal (+15%):</b> ${bon}</div>
    <div class="small" style="margin-top:4px">${ic('escudo')} <b>Escudo:</b> ${esc_}</div>
    ${ult ? `<button class="link" data-a="verResumo" data-id="${ult.ini}">Ver resumo da semana passada</button>` : ''}</div>`;
}
function cardMeta(m){

  const aberta = ui.aberta === m.id;
  let corpo = '';
  if (m.tipo === 'auto'){
    const p = m.alvo ? Math.min(100, m.progresso/m.alvo*100) : 0;
    corpo = `<div class="mbar"><i style="width:${p}%;background:${c.cor}"></i></div>
      <div class="small">${num(m.progresso)} / ${num(m.alvo)} ${esc(m.unidade||'')} · ${Math.floor(m.alvo? m.progresso/m.alvo*100 : 0)}%</div>`;

    <b>${esc(m.titulo)}</b> ${st}

  </div></div>`;
  if (m.tipo === 'manual' && m.status === 'ativa'){
    h += `<div class="row"><button class="btn ok" data-a="cumprida" data-id="${m.id}">Cumprida</button>
      <button class="btn sec" data-a="naoCumprida" data-id="${m.id}">Não cumprida</button></div>`;
  }
  h += `<button class="link" data-a="abrir" data-id="${m.id}">${aberta?'▾':'▸'} Quests (${qs.length})</button>`;

    h += qs.map(q => `<div class="quest"><div class="qtxt"><b>${esc(q.titulo)}</b>

          : `${FREQ[q.freq]} · ${num(q.valor)} ${m.tipo==='auto'?esc(m.unidade||''):'vez(es)'} por período`}</span></div>
        <button class="link" data-a="editarQuest" data-id="${q.id}">editar</button></div>`).join('');
    h += `<div class="row"><button class="btn sec" data-a="novaQuest" data-id="${m.id}">+ Quest</button>
      <button class="btn sec" data-a="editarMeta" data-id="${m.id}">Editar meta</button></div>`;
    if (m.status !== 'ativa') h += `<button class="btn sec" data-a="reabrir" data-id="${m.id}">Reabrir meta</button>`;
  }
  return h + `</div>`;
}
function telaMetas(){
  const filtros = {todas:'Todas', ...PRAZO_CURTO};
  let h = `<div class="sub">${Object.entries(filtros).map(([k,v]) =>
    `<button class="chip ${ui.filtro===k?'on':''}" data-a="filtro" data-id="${k}">${v}</button>`).join('')}</div>`;
  const lista = S.metas.filter(m => ui.filtro === 'todas' || m.prazo === ui.filtro);
  const ordem = {ativa:0, cumprida:1, nao:2};
  lista.sort((a,b) => ordem[a.status]-ordem[b.status]);
  h += lista.length ? lista.map(cardMeta).join('') : `<div class="vazio">Nenhuma meta aqui ainda.</div>`;
  h += `<button class="btn" data-a="novaMeta">+ Nova meta</button>`;
  return h;
}

  const completas = S.metas.filter(m => m.status === 'cumprida').length;
  let h = `<h2>Perfil</h2><div class="card" style="text-align:center">
    <div style="width:120px;height:120px;margin:0 auto;border:3px solid var(--line);background:#dfe9f5;border-radius:16px;overflow:hidden">${personagemSVG()}</div>
    <div class="px" style="margin-top:8px;font-size:1.1rem">Nível ${nv.n}</div>
    <div class="small">Classe: Residente R3 de Pediatria</div>
    <div class="bar" style="background:#fff"><i style="width:${nv.dentro/nv.need*100}%"></i></div>
    <div class="small">${nv.dentro} / ${nv.need} XP · ${S.xp} XP no total</div></div>
    <div class="card">
      <div class="row" style="text-align:center">
        <div><div class="px" style="font-size:1.3rem">${ic('fogo')} ${S.seq.atual}</div><div class="small">sequência</div></div>
        <div><div class="px" style="font-size:1.3rem">${ic('medalha')} ${S.seq.recorde}</div><div class="small">recorde</div></div>
        <div><div class="px" style="font-size:1.3rem">${ic('trofeu')} ${completas}</div><div class="small">metas completas</div></div>
      </div>
      <div class="row" style="text-align:center;margin-top:10px">
        <div><div class="px" style="font-size:1.3rem">${ic('moeda')} ${S.moedas}</div><div class="small">moedas</div></div>
        <div><div class="px" style="font-size:1.3rem">${ic('bau')} ${S.baus}</div><div class="small">baús guardados</div></div>
        <div><div class="px" style="font-size:1.3rem">${ic('escudo')} ${S.escudos}/${ESCUDOS_MAX}</div><div class="small">escudos</div></div>
      </div>
      <div class="row" style="text-align:center;margin-top:10px">
        <div><div class="px" style="font-size:1.3rem">${ic('pergaminho')} ${S.itens.pergaminho||0}</div><div class="small">pergaminhos</div></div>
        <div><div class="px" style="font-size:1.3rem">${ic('dado')} ${S.itens.dado||0}</div><div class="small">dados</div></div>
      </div></div>
    <h2>Nível por categoria</h2><div class="card">`;
  h += CATS.map(c => { const v = nivel(S.catXp[c.id]||0);
    return `<div class="catlv"><span class="nm">${c.nome}</span><div class="bar"><i style="width:${v.dentro/v.need*100}%;background:${c.cor}"></i></div><span class="n px">Nv ${v.n}</span></div>`; }).join('');
  return h + `</div>`;
}
function telaConfig(){
  return `<h2>Configurações</h2>
    <div class="card"><b>Backup</b><p class="small">Seus dados ficam só neste celular. Exporte um backup de vez em quando (ex.: toda semana) e guarde em Arquivos/iCloud.</p>
      <button class="btn" data-a="exportar">Exportar backup</button>
      <button class="btn sec" data-a="importar">Importar backup</button>
      <input type="file" id="arqImport" accept=".json,application/json" style="display:none"></div>
    <div class="card"><b>Escudos ${ic('escudo')} ${S.escudos}/${ESCUDOS_MAX}</b><p class="small">Se um dia não for cumprido e você tiver sequência, o app pergunta se quer usar um escudo para mantê-la. Ganhe 1 por semana cumprida: falhando no máximo 1 dia (máx. ${ESCUDOS_MAX} guardados; com o estoque cheio, o escudo ganho vira ${ESCUDO_EXCEDENTE_MOEDAS} moedas). O dia protegido por escudo conta como falha para o bônus e para o escudo da semana.</p></div>
    <div class="card"><b>Virada do dia</b><p class="small">O dia vira às ${pad(VIRADA_HORA)}h (o que você marcar de madrugada conta para o dia anterior).</p></div>
    <div class="card"><b>Zona de perigo</b><p class="small">Apaga metas, quests, XP, moedas e histórico. Use para limpar os testes.</p>
      <button class="btn bad" data-a="apagarTudo">Apagar tudo</button></div>
    <div class="small" style="color:#a59cc4;text-align:center">Life UP v${VERSAO}</div>`;
}
function render(){
  let corpo = '';
  if (ui.tab === 'missoes') corpo = telaMissoes();
  else if (ui.tab === 'metas') corpo = telaMetas();
  else if (ui.tab === 'calendario') corpo = telaEmBreve('Calendário', 'O calendário com o resultado de cada dia e seus eventos chega na próxima fase. O histórico de hoje em diante já está sendo guardado.');
  else if (ui.tab === 'loja') corpo = telaLoja();
  else if (ui.tab === 'perfil') corpo = telaPerfil();
  else if (ui.tab === 'config') corpo = telaConfig();
  const nb = (id, icn, txt) => `<button class="${ui.tab===id?'on':''}" data-a="tab" data-id="${id}"><span>${ic(icn,'28px')}</span>${txt}</button>`;
  app.innerHTML = topo() + `<main>${corpo}</main>
    <nav>${nb('missoes','espada','Missões')}${nb('metas','alvo','Metas')}${nb('calendario','calendario','Calendário')}${nb('loja','loja','Loja')}</nav>`;
}

/* ===================== FORMULÁRIOS ===================== */
const sheetEl = document.getElementById('sheet');
const fecharSheet = () => { sheetEl.innerHTML = ''; };
function formMeta(id){
  const m = id ? meta(id) : {titulo:'', cat:4, prazo:'longo', tipo:'auto', alvo:'', unidade:'', obs:'', fim:fimPadrao(hoje(),'longo')};
  const inicio = id ? (m.criada || hoje()) : hoje();
  sheetEl.innerHTML = `<div class="sheet"><h3>${id?'Editar meta':'Nova meta'}</h3><div class="card">
    <label>Título</label><input id="fTitulo" value="${esc(m.titulo)}" placeholder="Ex.: Juntar R$ 12 mil">
    <label>Categoria</label><select id="fCat">${CATS.map(c=>`<option value="${c.id}" ${c.id==m.cat?'selected':''}>${c.nome}</option>`).join('')}</select>
    <label>Prazo</label><select id="fPrazo">${Object.entries(PRAZOS).map(([k,v])=>`<option value="${k}" ${k===m.prazo?'selected':''}>${v}</option>`).join('')}</select>
    <label>Data final</label><input id="fFim" type="date" value="${m.fim}">
    <div class="small">Calculada pelo prazo; pode mudar (ex.: 31/12 para metas do ano). Usada para recalcular as quests periódicas.</div>
    <label>Tipo de conclusão</label>
    <select id="fTipo"><option value="auto" ${m.tipo==='auto'?'selected':''}>Progresso (tem um alvo; completa sozinha)</option>
      <option value="manual" ${m.tipo==='manual'?'selected':''}>Marco (eu marco cumprida / não cumprida)</option></select>
    <div id="fAlvoBox"><div class="row">
      <div><label>Alvo</label><input id="fAlvo" type="number" inputmode="decimal" step="any" value="${m.alvo}" placeholder="12000"></div>
      <div><label>Unidade</label><input id="fUn" value="${esc(m.unidade||'')}" placeholder="R$, livros…"></div></div></div>
    <label>Observações</label><textarea id="fObs" placeholder="Datas, detalhes…">${esc(m.obs)}</textarea>
    <button class="btn" data-a="salvarMeta" data-id="${id||''}">Salvar</button>
    ${id?`<button class="btn bad" data-a="apagarMeta" data-id="${id}">Apagar meta</button>`:''}
    <button class="btn sec" data-a="fechar">Cancelar</button></div></div>`;
  const tipo = document.getElementById('fTipo'), box = document.getElementById('fAlvoBox');
  const upd = () => box.style.display = tipo.value === 'auto' ? '' : 'none';
  tipo.onchange = upd; upd();
  document.getElementById('fPrazo').onchange = e => { document.getElementById('fFim').value = fimPadrao(inicio, e.target.value); };
}
function salvarMeta(id){
  const v = x => document.getElementById(x).value;
  const titulo = v('fTitulo').trim();
  if (!titulo) return janela('<h3>Dê um título à meta</h3>', [{txt:'Ok', ret:1}]);
  const tipo = v('fTipo');
  const alvo = parseFloat(String(v('fAlvo')).replace(',','.'));
  if (tipo === 'auto' && !(alvo > 0)) return janela('<h3>Informe o alvo da meta</h3><p class="small">Ex.: 12000 (R$) ou 12 (livros).</p>', [{txt:'Ok', ret:1}]);
  const dados = { titulo, cat:+v('fCat'), prazo:v('fPrazo'), tipo, alvo: tipo==='auto'?alvo:0, unidade:v('fUn').trim(), obs:v('fObs').trim(), fim: v('fFim') || fimPadrao(hoje(), v('fPrazo')) };
  if (id){
    const m = meta(id); Object.assign(m, dados);
    if (m.tipo === 'auto' && m.status === 'ativa' && m.progresso >= m.alvo){ /* alvo reduzido: completa no próximo progresso */ }
  } else {
    const m = { id:uid(), ...dados, progresso:0, status:'ativa', criada:hoje(), concluida:null };
    S.metas.push(m); ui.aberta = m.id;
  }
  sincronizarHoje(); salvar(); fecharSheet(); render();
}
let formDias = [];
function formQuest(id, metaId){
  const q = id ? quest(id) : {titulo:'', metas:[metaId], dif:'m', freq:'dias', dias:[], valor:''};
  const fq = q.freq || 'dias';
  formDias = [...q.dias];
  const metas = S.metas.filter(m => m.status !== 'nao' || q.metas.includes(m.id));
  sheetEl.innerHTML = `<div class="sheet"><h3>${id?'Editar quest':'Nova quest'}</h3><div class="card">
    <label>Título</label><input id="qTitulo" value="${esc(q.titulo)}" placeholder="Ex.: Ler 20 páginas">
    <label>Dificuldade</label><select id="qDif">${Object.entries(DIF).map(([k,d])=>`<option value="${k}" ${k===q.dif?'selected':''}>${d.nome} · ${d.xp} XP · ${d.m} moedas</option>`).join('')}</select>
    <label>Frequência</label><select id="qFreq">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}" ${k===fq?'selected':''}>${v}</option>`).join('')}</select>
    <div id="qDiasBox"><label>Dias</label><div class="days" id="qDias">${SEMANA.map((s,i)=>`<button data-d="${i}" class="${formDias.includes(i)?'on':''}">${s[0]}</button>`).join('')}</div>
    <div class="small" id="qDiasTxt"></div></div>
    <label>Ligada às metas</label>${metas.map(m=>`<label class="ck"><input type="checkbox" value="${m.id}" ${q.metas.includes(m.id)?'checked':''}>
      <span class="tag" style="background:${cat(m.cat).cor}">${esc(m.titulo)}</span></label>`).join('')}
    <div id="qValorBox"><label id="qValorLbl">Valor sugerido (quanto soma na meta)</label>
      <input id="qValor" type="number" inputmode="decimal" step="any" value="${q.valor}" placeholder="1">
      <div class="small" id="qValorTxt"></div></div>
    <button class="btn" data-a="salvarQuest" data-id="${id||''}">Salvar</button>
    ${id?`<button class="btn bad" data-a="apagarQuest" data-id="${id}">Apagar quest</button>`:''}
    <button class="btn sec" data-a="fechar">Cancelar</button></div></div>`;
  const updDias = () => {
    document.querySelectorAll('#qDias button').forEach(b => b.classList.toggle('on', formDias.includes(+b.dataset.d)));
    document.getElementById('qDiasTxt').textContent = formDias.length ? '' : 'Nenhum dia marcado = todos os dias';
  };
  document.querySelectorAll('#qDias button').forEach(b => b.onclick = () => {
    const d = +b.dataset.d; formDias = formDias.includes(d) ? formDias.filter(x=>x!==d) : [...formDias, d].sort(); updDias();
  });
  const updValor = () => {
    const sel = [...document.querySelectorAll('.sheet .ck input:checked')].map(i => meta(i.value));
    const auto = sel.some(m => m && m.tipo==='auto');
    const periodica = document.getElementById('qFreq').value !== 'dias';
    document.getElementById('qDiasBox').style.display = periodica ? 'none' : '';
    document.getElementById('qValorBox').style.display = (auto || periodica) ? '' : 'none';
    document.getElementById('qValorLbl').textContent = periodica ? 'Meta do período' : 'Valor sugerido (quanto soma na meta)';
    document.getElementById('qValorTxt').textContent = periodica
      ? (auto ? 'Quanto juntar/fazer em cada período. Ex.: 1000 (R$ por mês).' : 'Quantas vezes por período. Ex.: 3 (academia 3x na semana).') : '';
  };
  document.querySelectorAll('.sheet .ck input').forEach(i => i.onchange = updValor);
  document.getElementById('qFreq').onchange = updValor;
  updDias(); updValor();
}
function salvarQuest(id){
  const titulo = document.getElementById('qTitulo').value.trim();
  const metas = [...document.querySelectorAll('.sheet .ck input:checked')].map(i => i.value);
  if (!titulo) return janela('<h3>Dê um título à quest</h3>', [{txt:'Ok', ret:1}]);
  if (!metas.length) return janela('<h3>Ligue a quest a pelo menos uma meta</h3>', [{txt:'Ok', ret:1}]);
  const valor = parseFloat(String(document.getElementById('qValor').value).replace(',','.')) || 1;
  const freq = document.getElementById('qFreq').value;
  const dados = { titulo, metas, dif:document.getElementById('qDif').value, freq, dias: freq==='dias' ? [...formDias] : [], valor };
  if (id) Object.assign(quest(id), dados);
  else S.quests.push({ id:uid(), ...dados, ativa:true, criada:hoje() });
  sincronizarHoje(); salvar(); fecharSheet(); render();
}
function formExtra(){
  const metas = S.metas.filter(m => m.status !== 'nao');
  sheetEl.innerHTML = `<div class="sheet"><h3>Quest extra</h3><div class="card">
    <p class="small">Para imprevistos do dia. Vale ${EXTRA_MOEDAS} ${ic('moeda')} (até ${EXTRA_MAX_PAGAS} por dia), não dá XP e não conta para a sequência.</p>
    <label>Título</label><input id="xTitulo" placeholder="Ex.: Resolver pendência do banco">
    <label>Ligar a uma meta? (opcional)</label><select id="xMeta"><option value="">Nenhuma</option>
      ${metas.map(m=>`<option value="${m.id}">${esc(m.titulo)}</option>`).join('')}</select>
    <button class="btn" data-a="salvarExtra">Adicionar</button>
    <button class="btn sec" data-a="fechar">Cancelar</button></div></div>`;
}

/* ===================== BACKUP ===================== */
async function exportar(){
  const nome = `lifeup-backup-${hoje()}.json`;
  const txt = JSON.stringify(S);
  const arq = new File([txt], nome, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[arq]})){ await navigator.share({files:[arq], title:'Backup Life UP'}); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(arq); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}
function importar(){
  const inp = document.getElementById('arqImport');
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const dados = JSON.parse(await f.text());
      if (!dados || dados.v !== 1 || !Array.isArray(dados.metas)) throw 0;
      if (!(await confirmar('Substituir todos os dados atuais por este backup?', 'Substituir', 'bad'))) return;
      S = dados; migrar(); diaAtual = null; salvar(); render(); await checarVirada();
      janela('<h3>Backup importado!</h3>', [{txt:'Ok', ret:1}]);
    } catch(e){ janela('<h3>Arquivo inválido</h3><p class="small">Escolha um arquivo de backup do Life UP (.json).</p>', [{txt:'Ok', ret:1}]); }
    inp.value = '';
  };
  inp.click();
}

/* ===================== CLIQUES ===================== */
const acoes = {
  tab: id => { ui.tab = id; render(); window.scrollTo(0,0); },
  filtro: id => { ui.filtro = id; render(); },
  sub: id => { ui.sub = id; render(); },
  registrar,
  desfazerReg: async id => { if (await confirmar('Desfazer o último registro desta quest?', 'Desfazer')) desfazerRegistro(id); },
  abrir: id => { ui.aberta = ui.aberta === id ? null : id; render(); },
  concluir: concluirQuest,
  desfazer: async id => { if (await confirmar('Desmarcar esta quest?', 'Desmarcar')) desfazerQuest(id); },
  extra: toggleExtra,
  novaExtra: formExtra,
  salvarExtra: () => {
    const t = document.getElementById('xTitulo').value.trim(); if (!t) return;
    diaDeHoje().extras.push({ id:uid(), titulo:t, meta:document.getElementById('xMeta').value || null, feita:false, moedas:0 });
    salvar(); fecharSheet(); render();
  },
  apagarExtra: async id => {
    if (!(await confirmar('Apagar esta quest extra?', 'Apagar', 'bad'))) return;
    const r = diaDeHoje(), x = r.extras.find(e => e.id === id);
    if (x && x.feita){ S.moedas -= x.moedas; logSem(x.sem || semAtual(), 0, 0, x.moedas, {}, -1); }
    r.extras = r.extras.filter(e => e.id !== id); salvar(); render();
  },
  novaMeta: () => formMeta(null),
  editarMeta: id => formMeta(id),
  salvarMeta,
  apagarMeta: async id => {
    if (!(await confirmar('Apagar esta meta? As quests ligadas só a ela também serão apagadas. O XP já ganho continua.', 'Apagar', 'bad'))) return;
    S.metas = S.metas.filter(m => m.id !== id);
    S.quests.forEach(q => q.metas = q.metas.filter(x => x !== id));
    S.quests = S.quests.filter(q => q.metas.length);
    sincronizarHoje(); salvar(); fecharSheet(); render();
  },
  novaQuest: id => formQuest(null, id),
  editarQuest: id => formQuest(id),
  salvarQuest,
  apagarQuest: async id => {
    if (!(await confirmar('Apagar esta quest? O XP já ganho continua.', 'Apagar', 'bad'))) return;
    S.quests = S.quests.filter(q => q.id !== id);
    sincronizarHoje(); salvar(); fecharSheet(); render();
  },
  cumprida: async id => { if (await confirmar('Marcar esta meta como cumprida?', 'Cumprida', 'ok')) metaManual(id, 'cumprida'); },
  naoCumprida: async id => { if (await confirmar('Marcar como não cumprida? O XP e as moedas das quests continuam; só o bônus de conclusão é perdido.', 'Não cumprida')) metaManual(id, 'nao'); },
  reabrir: async id => { if (await confirmar('Reabrir esta meta? Se ela deu bônus de conclusão, ele é desfeito.', 'Reabrir')) reabrirMeta(id); },
  fechar: fecharSheet,
  abaLoja: id => { ui.loja = id; render(); },
  comprar, acoesQuest, resgatar,
  novaRecompensa: () => formRecompensa(null),
  editarRecompensa: id => formRecompensa(id),
  salvarRecompensa,
  apagarRecompensa: async id => {
    if (!(await confirmar('Apagar esta recompensa?', 'Apagar', 'bad'))) return;
    S.recompensas = S.recompensas.filter(r => r.id !== id); salvar(); fecharSheet(); render();
  },
  desfazerResgate: async id => { if (await confirmar('Desfazer este resgate? As moedas voltam.', 'Desfazer')) desfazerResgate(id); },
  verResumo: id => { const R = S.resumos[id]; if (R) janela(htmlResumo(R), [{txt:'Fechar', ret:1}]); },
  exportar, importar,
  apagarTudo: async () => {
    if (!(await confirmar('Apagar TUDO? Isso não pode ser desfeito (a não ser que você tenha um backup).', 'Apagar tudo', 'bad'))) return;
    S = novoEstado(); migrar(); diaDeHoje(); salvar(); ui.tab = 'missoes'; render();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const f = acoes[el.dataset.a];
  if (f) f(el.dataset.id || null, el);
});

/* ===================== INÍCIO ===================== */
checarVirada();
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarVirada(); });
setInterval(checarVirada, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
