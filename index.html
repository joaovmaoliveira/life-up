<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life UP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life UP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c2846">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#2c2846;color:#f0c83c;
    font-family:"Courier New",monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);}
  img{width:128px;height:128px;image-rendering:pixelated;}
  h1{font-size:2.4rem;margin:16px 0 8px;letter-spacing:2px;}
  p{color:#e8e4f5;margin:4px 0;}
  .v{opacity:.5;font-size:.8rem;margin-top:24px;}
</style>
</head>
<body>
  <img src="icon-512.png" alt="Baú">
  <h1>Life UP</h1>
  <p>Versão de teste ✔</p>
  <p>Se você está vendo isto no iPhone, a instalação funcionou.</p>
  <p class="v">v0.0.1</p>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
